[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdacn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "powerlaw>=2.0.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.setuptools]
packages = ["src"]
